<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{--bg:#07060d;--ink:#dff1ff;--fd:Orbitron,'Arial Black',Impact,sans-serif;--fb:Rajdhani,'Segoe UI','Trebuchet MS',sans-serif;--dim:#8a86a8;--hot:#ff4d6d;--cy:#7ffcff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07060d}}
:root[data-theme="dark"]{--bg:#07060d}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%}
canvas{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(ellipse at 50% 28%,rgba(7,6,13,.92) 0,rgba(7,6,13,.55) 75%);overflow:auto}
#ov h1{font-family:var(--fd);font-weight:400;font-size:clamp(76px,22vw,84px);line-height:1;margin:0 0 14px;letter-spacing:.02em;transform:rotate(-3deg);background:linear-gradient(180deg,#ffe066 0%,#ff9a3c 50%,#ff3d9a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #2a0a3a) drop-shadow(0 0 8px #ff7ad9) drop-shadow(0 0 22px #ff6a3c) drop-shadow(0 0 46px rgba(255,61,154,.75));animation:pop .7s cubic-bezier(.2,1.6,.4,1) both,neon 2.4s ease-in-out .8s infinite alternate}
@keyframes neon{to{filter:drop-shadow(0 5px 0 #2a0a3a) drop-shadow(0 0 12px #ff7ad9) drop-shadow(0 0 32px #ff6a3c) drop-shadow(0 0 64px rgba(255,61,154,.9))}}
@keyframes flow{to{background-position:300% 0}}
@keyframes pop{from{transform:scale(.3) rotate(-10deg);opacity:0}}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){#ov *,#ov{animation:none!important}}
#ov p{margin:6px 0;max-width:380px;line-height:1.45;font-size:17px;color:#d6d8ff;text-shadow:0 2px 6px #000;animation:rise .5s both}
#ov p:nth-of-type(2){animation-delay:.1s}#ov p:nth-of-type(3){animation-delay:.2s}#ov p:nth-of-type(4){animation-delay:.3s}
#ov b{color:var(--ink);font-weight:600}
#bx{display:flex;flex-direction:column;gap:8px;margin-top:16px;width:min(330px,90%)}
button{font:inherit;font-size:17px;color:var(--ink);background:rgba(127,252,255,.14);border:3px solid rgba(127,252,255,.4);border-radius:18px;padding:12px 16px;cursor:pointer;transition:transform .12s}
button:hover:not(:disabled){transform:scale(1.05)}
button:active:not(:disabled){transform:scale(.95)}
button.main{background:#7ffcff;color:#06222a;border-color:transparent;font-family:var(--fd);font-weight:400;font-size:20px;letter-spacing:.04em;box-shadow:0 6px 0 #0a7f8a;animation:none}
button:disabled{opacity:.35;cursor:default}
#mute{position:absolute;right:10px;bottom:10px;z-index:5;padding:4px 12px;font-size:20px;border-radius:12px;background:rgba(7,6,13,.6)}
button:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
#ov h1.sm{font-size:clamp(30px,8vw,40px);margin:0 0 10px;transform:none}
#st{display:flex;gap:28px;align-items:center;margin:2px 0 14px}
#st .hr{color:#ff4d6d;font-size:26px;letter-spacing:3px}
#st .co{color:#ffd166;font-size:26px;font-weight:700}
#sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(380px,92%)}
button.card{display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(255,255,255,.06);border:2px solid var(--c);border-radius:16px;padding:12px 6px}
button.card .ic{width:34px;height:34px;color:var(--c)}
button.card .ic svg{width:100%;height:100%;display:block}
#ov .card b{font-family:var(--fd);font-weight:400;font-size:14px;color:var(--ink);margin-top:2px}
.card small{font-size:12px;color:#9b98c4}
.card .pips{height:11px}
.card .pips i{display:inline-block;width:8px;height:8px;border-radius:50%;border:2px solid var(--c);margin:0 2px}
.card .pips i.on{background:var(--c)}
.card .pr{margin-top:3px;padding:3px 14px;border-radius:999px;background:var(--c);color:#07060d;font-weight:700;font-size:14px}
#go{margin-top:18px;width:min(380px,92%)}
html,body{overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#ov{justify-content:flex-start;touch-action:pan-y;overscroll-behavior:contain}
#ov::before,#ov::after{content:"";margin:auto}
#jtg,#ctl{display:none}
#ctl{position:fixed;inset:0;pointer-events:none;z-index:4}
#ctl.on{display:block}
#jz{position:absolute;left:0;bottom:0;width:52%;height:60%;pointer-events:auto;touch-action:none}
#jb{position:absolute;left:0;top:0;width:116px;height:116px;border-radius:50%;border:3px solid rgba(127,252,255,.35);background:rgba(127,252,255,.08);opacity:.55;pointer-events:none}
#jb.on{opacity:1}
#jk{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:rgba(127,252,255,.6);box-shadow:0 0 14px #7ffcff}
#atk{--ab:clamp(88px,25vw,116px);position:absolute;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:var(--ab);height:var(--ab);min-height:0;padding:0;border:0;border-radius:50%;pointer-events:auto;touch-action:none;font-family:var(--fd);font-size:15px;letter-spacing:.04em;color:#2a0a10;background:conic-gradient(rgba(0,0,0,.45) calc(var(--cd,0)*1turn),#ff4d6d 0);box-shadow:0 6px 0 #8a1f36,0 0 22px rgba(255,77,109,.55)}
#atk::after{content:"";position:absolute;inset:-16px;border-radius:50%}
#atk.dn{transform:scale(.93)}
body.mob #mute,body.mob #jtg{position:fixed;display:block;width:52px;height:52px;min-height:0;padding:0;border-radius:50%;font-size:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);background:rgba(7,6,13,.6)}
body.mob #mute{left:calc(50% + 8px);right:auto}
body.mob #jtg{right:calc(50% + 8px);z-index:5}
body.mob button{min-height:56px;font-size:19px;padding:14px 18px}
body.mob #bx{gap:12px}
body.mob #ov p{font-size:19px}
body.mob #st .hr,body.mob #st .co{font-size:34px}
body.mob button.card{padding:16px 8px;gap:4px}
body.mob #ov .card b{font-size:17px}
body.mob .card small{font-size:14px}
body.mob .card .pr{font-size:17px;padding:5px 16px}
body.mob #ov{padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) 24px max(24px,env(safe-area-inset-left))}
@media (max-height:520px){#ov h1{font-size:clamp(40px,14vh,64px);margin-bottom:6px}#ov h1.sm{font-size:clamp(26px,8vh,34px);margin:0 0 6px}#ov p{font-size:15px;margin:3px 0}#st{margin:0 0 8px}#bx{margin-top:8px}}
@media (max-height:520px) and (min-width:560px){#sg{grid-template-columns:repeat(4,1fr);width:min(680px,94%)}}
.tr{display:flex;align-items:center;gap:12px;text-align:left}
.tj,.ta{flex:none;width:44px;height:44px;border-radius:50%}
.tj{border:3px solid #7ffcff;background:radial-gradient(#7ffcff 0 28%,rgba(127,252,255,.1) 30%)}
.ta{background:#ff4d6d;box-shadow:0 4px 0 #8a1f36}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(7,6,13,.85);padding:8px 16px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6;font-size:16px;text-align:center}
:root{--js:clamp(118px,30vmin,160px);--abs:clamp(84px,21vmin,120px)}
@media (min-width:768px) and (min-height:600px){:root{--js:clamp(110px,18vmin,150px);--abs:clamp(80px,13vmin,110px)}}
#jb{position:fixed;left:calc(env(safe-area-inset-left,0px) + 24px);top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:var(--js);height:var(--js);opacity:.7}
#jk{width:40%;height:40%;left:30%;top:30%}
#jz{position:fixed;width:calc(var(--js) + 90px);height:calc(var(--js) + 110px)}
#atk{width:var(--abs);height:var(--abs);font-size:calc(var(--abs)*.16)}
#pause{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 10px);width:46px;height:46px;min-height:0;padding:0;border-radius:50%;font-size:18px;z-index:5;background:rgba(7,6,13,.6)}
body.mob #mute,body.mob #jtg{left:auto;bottom:auto;right:calc(env(safe-area-inset-right,0px) + 10px);width:46px;height:46px;font-size:20px}
body.mob #mute{top:calc(env(safe-area-inset-top,0px) + 92px)}
body.mob #jtg{top:calc(env(safe-area-inset-top,0px) + 146px)}
#mute{font-size:14px;letter-spacing:.05em}
body.mob #mute,body.mob #jtg,#pause{font-size:12px;letter-spacing:0}
#ctl.noatk #atk{display:none}
/* ===== MARCO FUTURISTA =====
   #frame se coloca por JS exactamente sobre el área de juego (ver resize). No captura toques (pointer-events:none). */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
#frame{position:absolute;pointer-events:none;z-index:0;border-radius:14px;--cw:clamp(22px,7vmin,38px)}
/* resplandor ambiental: el pulso anima solo la opacidad (barato en móvil) */
#frame .gl{position:absolute;inset:0;border-radius:inherit;will-change:opacity;box-shadow:0 0 16px rgba(127,252,255,.4),0 0 44px rgba(179,136,255,.28),inset 0 0 26px rgba(127,252,255,.14),inset 0 0 70px rgba(179,136,255,.08);animation:fglow 4.5s ease-in-out infinite}
@keyframes fglow{0%,100%{opacity:.6}50%{opacity:1}}
/* borde con degradado neón (cian > azul > violeta > magenta) y luz que recorre el marco */
#frame::before,#frame::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
#frame::before{background:linear-gradient(135deg,#7ffcff,#5a7bff 45%,#b388ff 70%,#ff3d9a)}
#frame::after{background:conic-gradient(from var(--ang),transparent 0 84%,rgba(255,255,255,.95) 94%,transparent 100%);animation:fspin 6s linear infinite}
@keyframes fspin{to{--ang:360deg}}
/* esquinas estilo HUD de nave */
#frame .fc{position:absolute;width:var(--cw);height:var(--cw);background:linear-gradient(135deg,#7ffcff,#ff3d9a);clip-path:polygon(0 0,100% 0,100% 14%,14% 14%,14% 100%,0 100%)}
#frame .fc:nth-of-type(1){left:-5px;top:-5px}
#frame .fc:nth-of-type(2){right:-5px;top:-5px;transform:scaleX(-1)}
#frame .fc:nth-of-type(3){left:-5px;bottom:-5px;transform:scaleY(-1)}
#frame .fc:nth-of-type(4){right:-5px;bottom:-5px;transform:scale(-1,-1)}
@media (prefers-reduced-motion:reduce){#frame .gl,#frame::after{animation:none}}
/* ===== REDISEÑO VISUAL v1.7 ===== */
#ov h1{font-size:clamp(56px,19vw,84px);letter-spacing:.04em;background:linear-gradient(180deg,#8fd9ff 0%,#6b7bff 42%,#b14dff 72%,#ff4fa8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #1b1146) drop-shadow(0 0 8px rgba(90,123,255,.85)) drop-shadow(0 0 22px rgba(177,77,255,.65)) drop-shadow(0 0 44px rgba(255,79,168,.4));animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
#ov h1.md{font-size:clamp(34px,10.5vw,64px)}
#ov h1.sm{font-size:clamp(26px,7vw,38px)}
#ov p{font-family:var(--fb);font-weight:600;font-size:18px;letter-spacing:.02em;color:#cfe3ff;text-shadow:0 1px 0 #000,0 0 14px rgba(80,120,255,.35)}
#ov b{color:#bfeaff;font-weight:700;text-shadow:0 0 10px rgba(127,252,255,.4)}
.card small{color:#a9b9e8;font-size:13px;font-weight:600}
/* pantallas de derrota / victoria: entrada con impacto, halo trasero, volumen y viñeta */
#ov .tw{position:relative;display:flex;justify-content:center;max-width:100%}
#ov .tw i{position:absolute;left:50%;top:50%;width:150%;height:210%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,40,100,.55),rgba(160,30,255,.28) 55%,transparent);filter:blur(10px);z-index:0;pointer-events:none;animation:halo 2.4s ease-in-out infinite alternate}
#ov .tw h1{position:relative;z-index:1}
#ov.defeat{box-shadow:inset 0 0 160px rgba(255,40,100,.45);animation:vin .9s ease-out both}
#ov.defeat h1{font-size:clamp(56px,18vw,96px);background:linear-gradient(180deg,#ffc2d4 0%,#ff3d6e 40%,#c01fff 80%,#5a2bff 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 2px 0 #3a0a3a) drop-shadow(0 4px 0 #3a0a3a) drop-shadow(0 7px 0 #240626) drop-shadow(0 0 18px rgba(255,61,110,.85)) drop-shadow(0 0 48px rgba(192,31,255,.6));animation:slam .9s cubic-bezier(.2,.9,.25,1.1) both}
#ov.defeat .tw{animation:shk .5s .5s}
#ov.win .tw i{background:radial-gradient(closest-side,rgba(255,209,102,.5),rgba(255,79,168,.25) 55%,transparent)}
#ov.win h1{background:linear-gradient(180deg,#fff3b0 0%,#ffd166 40%,#ff9a3c 75%,#ff4fa8 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 #3a1a0a) drop-shadow(0 0 18px rgba(255,209,102,.8)) drop-shadow(0 0 44px rgba(255,79,168,.5));animation:slam .9s cubic-bezier(.2,.9,.25,1.1) both}
@keyframes slam{0%{transform:scale(2.8) rotate(-9deg);opacity:0}45%{opacity:1}62%{transform:scale(.9) rotate(-3deg)}78%{transform:scale(1.06) rotate(-3deg)}100%{transform:scale(1) rotate(-3deg)}}
@keyframes halo{from{opacity:.55;transform:translate(-50%,-50%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes vin{0%{background-color:rgba(255,40,90,.55)}100%{background-color:transparent}}
@keyframes shk{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
@keyframes bp{50%{filter:brightness(1.14)}}
/* botones estilo arcade: borde luminoso, brillo al pasar, hundimiento al pulsar */
#ov button{position:relative;overflow:hidden;font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:#d4e8ff;background:linear-gradient(180deg,rgba(70,100,220,.38),rgba(24,18,76,.7));border:2px solid rgba(127,252,255,.55);border-radius:14px;padding:13px 16px;box-shadow:0 5px 0 #0c1040,0 0 14px rgba(90,123,255,.4),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .12s,box-shadow .12s,filter .12s}
#ov button::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-130%);transition:transform .55s}
#ov button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.15);box-shadow:0 7px 0 #0c1040,0 0 24px rgba(127,252,255,.6),inset 0 1px 0 rgba(255,255,255,.25)}
#ov button:hover:not(:disabled)::before{transform:translateX(130%)}
#ov button:active:not(:disabled){transform:translateY(4px) scale(.98);box-shadow:0 1px 0 #0c1040,0 0 10px rgba(127,252,255,.5)}
#ov button.main{font-size:19px;color:#04122e;background:linear-gradient(180deg,#a8f7ff 0%,#4fb8ff 55%,#3a6bff 100%);border-color:rgba(255,255,255,.75);box-shadow:0 6px 0 #1a3a9c,0 0 26px rgba(79,184,255,.7),inset 0 1px 0 rgba(255,255,255,.7);animation:bp 2.2s ease-in-out infinite}
#ov button.main:active:not(:disabled){box-shadow:0 2px 0 #1a3a9c,0 0 14px rgba(79,184,255,.6)}
#ov button.card{background:rgba(255,255,255,.05);border-color:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.45),0 0 12px rgba(127,252,255,.15);text-transform:none}
#mute,#jtg,#pause{font-family:var(--fd);font-weight:700;color:#bfe8ff;background:rgba(20,30,80,.5);border:1.5px solid rgba(127,252,255,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 0 12px rgba(90,123,255,.3)}
@media (max-height:520px){#ov h1.md{font-size:clamp(30px,10vh,48px)}#ov.defeat h1{font-size:clamp(46px,16vh,72px)}}
/* ===== v1.8: derrota, menús y opciones ===== */
#ov h1.sm{font-size:clamp(30px,9vw,46px)}
#wrap.shk{animation:wshk .6s}
@keyframes wshk{10%{transform:translate(-9px,4px)}25%{transform:translate(8px,-5px)}40%{transform:translate(-6px,3px)}60%{transform:translate(4px,-2px)}80%{transform:translate(-2px,1px)}}
@keyframes dIn{from{opacity:0;transform:translateY(28px) scale(.9);filter:blur(6px)}}
@keyframes bp2{50%{filter:brightness(1.35)}}
@keyframes ig{0%,100%{opacity:.15}50%{opacity:1}}
#ov.defeat p:nth-of-type(1){font-size:clamp(25px,7.4vw,40px);line-height:1.15;max-width:540px;font-weight:700;letter-spacing:.03em;color:#ffe0ec;margin-top:14px;text-shadow:0 2px 0 #3a0a30,0 0 18px rgba(255,61,110,.85),0 0 42px rgba(192,31,255,.5);animation:dIn .7s .8s both}
#ov.defeat p:nth-of-type(2){display:block;max-width:none;width:min(560px,94%);margin-top:16px;padding:10px 16px;font-size:clamp(19px,5.4vw,28px);font-weight:700;color:#bff4ff;background:linear-gradient(90deg,transparent,rgba(127,252,255,.18),transparent);border-top:1px solid rgba(127,252,255,.55);border-bottom:1px solid rgba(127,252,255,.55);text-shadow:0 0 14px rgba(127,252,255,.75);animation:dIn .7s 1.15s both}
#ov.defeat #bx{animation:dIn .6s 1.55s both}
#ov.defeat button.main{font-size:21px;animation:bp2 1.2s ease-in-out infinite}
#ov.defeat button.main::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 22px 4px rgba(255,255,255,.85);animation:ig 1.2s ease-in-out infinite;pointer-events:none}
#ov h2{font-family:var(--fd);font-size:15px;letter-spacing:.12em;color:#8fd9ff;margin:14px 0 4px;text-shadow:0 0 12px rgba(127,252,255,.6)}
#ov .lst{width:min(480px,94%);display:flex;flex-direction:column;gap:6px;text-align:left;margin:8px 0}
#ov .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 13px;background:rgba(20,30,80,.5);border:1px solid rgba(127,252,255,.3);border-radius:10px;animation:rise .4s both}
#ov .row b{font-family:var(--fd);font-size:13px;color:#bfeaff}
#ov .row small{display:block;font-size:14px;color:#a9b9e8;margin-top:2px}
#ov .row em{font-style:normal;font-weight:700;color:#ffd166;white-space:nowrap;font-size:14px}
#ov .opts{width:min(430px,92%);display:flex;flex-direction:column;gap:12px;margin:10px 0}
#ov .orow{background:rgba(20,30,80,.5);border:1px solid rgba(127,252,255,.3);border-radius:12px;padding:10px 14px;text-align:left}
#ov .ohd{display:flex;justify-content:space-between;font-weight:700;color:#cfe3ff;font-size:18px;margin-bottom:6px}
#ov .ohd em{font-style:normal;color:#7ffcff;font-family:var(--fd);font-size:14px}
#ov input[type=range]{width:100%;height:30px;-webkit-appearance:none;appearance:none;background:transparent;touch-action:pan-y;cursor:pointer;margin:0}
#ov input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:6px;background:linear-gradient(90deg,#7ffcff,#b388ff,#ff4fa8);box-shadow:0 0 10px rgba(127,252,255,.4)}

<div id="wrap"><canvas id="c"></canvas><div id="frame"><b class="gl"></b><i class="fc"></i><i class="fc"></i><i class="fc"></i><i class="fc"></i></div><div id="ov"></div><button id="mute" aria-label="Sonido" onclick="setMute(!muted)">SON</button><button id="jtg" aria-label="Cambiar controles" onclick="setJoy(!joyOn,1)"></button><button id="pause" aria-label="Pausa" onclick="pause()">II</button></div>
<div id="ctl"><div id="jz"></div><div id="jb"><div id="jk"></div></div><button id="atk" aria-label="Ataque">ATAQUE</button></div><div id="toast"></div>
<script>
const H=640,CDB=.55,cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
let W=360,S='menu',lv=0,t=0,gold=0,goldStart=0,hpCarry=3,K=0,bestChain=0,bossDead=false,banner=0,primary=null,ovAt=0,P=null,E=[],B=[],F=[],spawn=0,shake=0,freeze=0,sc=1,ox=0,oy=0,ac=null,msg='',msgT=0;
const U={dist:0,cd:0,hp:0},keys={};let lastDir={x:0,y:-1};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),maxHp=()=>3+U.hp+SAVE.perm.life,CDV=()=>FIRE();
// ===== MÓVIL: joystick, botón ATAQUE, zonas seguras y tutorial =====
const AIM=true,BUF=.2,EDGE=18;let JR=58; // AIM: el botón ATAQUE apunta al enemigo más cercano si el joystick está suelto
let jm=0,paused=false,pvOn=false,TK=0,PW={},nextHeal=30,PB=[],pm='',pmT=0,helpT=0,atkHeld=false,TR=[],LQ=false;
const UNL=[{k:'twin',n:6,t:'Disparo doble'},{k:'rapid',n:14,t:'Cadencia mejorada'},{k:'shield',n:24,t:'Escudo'},{k:'pierce',n:36,t:'Disparo perforante'},{k:'speed',n:50,t:'Velocidad'},{k:'boom',n:66,t:'Explosión en cadena'},{k:'freeze',n:84,t:'Congelación'},{k:'triple',n:105,t:'Disparo triple'}],SPD=()=>150*(PW.speed?1.2:1);
function award(){TK++;for(const u of UNL)if(!PW[u.k]&&TK>=u.n){PW[u.k]=1;announce('PODER DESBLOQUEADO',u.t,'power',5);blip(900,.3,'triangle',.12);burst(P.x,P.y,'#ffd166',26,260);shake=Math.max(shake,4);}
  if(TK>=nextHeal){nextHeal+=30;if(P.hp<maxHp()){P.hp++;announce('VIDA RECUPERADA','+1 vida','heal',4);blip(1000,.25,'triangle',.12);}}}
function killPw(e){K++;dropLoot(e);award();blip(480,.1,'square',.05);burst(e.x,e.y,e.k==='s'?'#ffd166':'#ff4d6d',8,120);}
function boom(x,y){shake=Math.max(shake,8);blip(120,.3,'sawtooth',.14);for(let i=0;i<36;i++){const a=i/36*6.283;F.push({x,y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,l:.5,c:'#ffd166',s:4});}
  for(const e of E)if(!e.dead&&e.k!=='b'&&Math.hypot(e.x-x,e.y-y)<120){e.dead=true;killPw(e);}}const vib=p=>{if(mobile&&OPT.vib&&navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}};
function pause(){if(S!=='play'||paused)return;paused=true;stopMusic();jend();atkHeld=false;showOv('PAUSA',['Tu partida está en pausa.'],[{t:'CONTINUAR',main:1,fn:resume},{t:'REINICIAR NIVEL',fn:()=>{paused=false;gold=goldStart;run(lv);}},{t:'MENÚ PRINCIPAL',fn:()=>{paused=false;menu();}}]);}
function resume(){if(!paused)return;paused=false;ov.style.display='none';startMusic();}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const VOL={m:+(ls.get('filo.vm')||80),s:+(ls.get('filo.vs')||80)},OPT={vib:ls.get('filo.vib')!=='0',diff:+(ls.get('filo.diff')||1),calm:ls.get('filo.calm')==='1',cb:ls.get('filo.cb')==='1'},gm=()=>VOL.m/80,gs=()=>VOL.s/80,MUL=()=>.6*gm(); // volumen 0-100 (80 = nivel de diseño)
// ===== PROGRESO GUARDADO (localStorage): récord, nivel más alto, checkpoint, banco de monedas y mejoras permanentes =====
const AUTOR='Equipo FILO'; // <-- escribe aquí tu nombre: aparece en los créditos
const SAVE=(()=>{let o=null;try{o=JSON.parse(ls.get('filo.save')||'null');}catch(e){}o=o||{};return Object.assign({unl:0,best:0,bank:0,cp:null},o,{perm:Object.assign({life:0,mag:0,loot:0},o.perm||{})});})();
const save=()=>ls.set('filo.save',JSON.stringify(SAVE));
let SP=[],PU=[],FT=[],pick=0,bankedRun=0; // avisos de aparición, objetos del suelo, textos flotantes, monedas recogidas en la partida
const score=()=>TK*10+gold*2+(lv+1)*100;
function bankPick(){const add=Math.floor(pick*.4)-bankedRun;if(add>0){SAVE.bank+=add;bankedRun+=add;}SAVE.best=Math.max(SAVE.best,score());save();} // 40 % de lo recogido pasa al banco
// ===== DIFICULTAD Y ACCESIBILIDAD =====
const DF=()=>[.86,1,1.12][OPT.diff]||1,DS=()=>[1.25,1,.88][OPT.diff]||1; // velocidad de enemigos / intervalo de aparición
function applyOpts(){document.body.classList.toggle('calm',OPT.calm);}
function toggleFS(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){}}
// ===== OBJETOS DEL CAMPO: las monedas caen al suelo y hay que recogerlas; a veces sueltan un potenciador temporal =====
const ft=(x,y,s,c)=>FT.push({x,y,s,c,l:1});
function dropLoot(e){PU.push({x:e.x,y:e.y,k:'coin',v:Math.round(3*(1+.2*SAVE.perm.loot)),l:9});
  if(Math.random()<.08*(e.k==='h'||e.k==='d'?1.6:1)){const r=Math.random();PU.push({x:e.x+8,y:e.y-8,k:r<.4?'heart':r<.75?'shield':'haste',l:10});}}
function collect(p){if(p.k==='coin'){gold+=p.v;pick+=p.v;blip(980,.06,'triangle',.05);}
  else if(p.k==='heart'){if(P.hp<maxHp()){P.hp++;ft(P.x,P.y-18,'+1 VIDA','#ff6b81');}else{gold+=10;pick+=10;ft(P.x,P.y-18,'+10 MONEDAS','#ffd166');}blip(900,.2,'triangle',.1);}
  else if(p.k==='shield'){P.shT=Math.max(P.shT,6);ft(P.x,P.y-18,'ESCUDO','#7ffcff');blip(700,.2,'sine',.1);}
  else{P.hs=6;ft(P.x,P.y-18,'CADENCIA RÁPIDA','#ffd166');blip(1100,.2,'square',.07);}
  burst(p.x,p.y,p.k==='coin'?'#ffd166':'#ffffff',8,100);}
// Impacto de un disparo sobre un enemigo normal: el blindado aguanta 3, el divisor se parte en dos mini perseguidores
function hitEnemy(e,b){if(e.k==='h'&&--e.hp>0){e.hit=t+.15;blip(300,.08,'square',.08);burst(e.x,e.y,'#9fd0ff',6,90);b.l=0;return;}
  e.dead=true;kill(e);if(e.k==='d')for(let i=0;i<2;i++){const a=Math.random()*6.28;E.push({x:e.x+Math.cos(a)*10,y:e.y+Math.sin(a)*10,k:'c',r:9,f:1,lf:0,fs:1.25,ph:Math.random()*6.28,mini:1});}
  if(--b.p<=0)b.l=0;}
function drawSpawn(){for(const s of SP){const k=1-s.t/s.m,pu=.5+.5*Math.sin(t*18);ctx.strokeStyle='rgba(255,77,109,'+(.35+.5*pu)+')';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(s.mx,s.my,10+14*(1-k),0,7);ctx.stroke();ctx.fillStyle='rgba(255,77,109,'+(.2+.4*k)+')';ctx.beginPath();ctx.arc(s.mx,s.my,5,0,7);ctx.fill();}}
function drawPickups(){for(const p of PU){if(p.l<2&&Math.floor(t*10)%2)continue;const pu=.5+.5*Math.sin(t*6+p.x);
  if(p.k==='coin'){glow('#ffd166',8);ctx.beginPath();ctx.arc(p.x,p.y,6,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#8a5a00';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(p.x-1.5,p.y-1.5,2,0,7);ctx.fill();}
  else{const c=p.k==='heart'?'#ff6b81':p.k==='shield'?'#7ffcff':'#ffd166';ctx.globalAlpha=.35+.25*pu;ctx.fillStyle=c;ctx.beginPath();ctx.arc(p.x,p.y,15,0,7);ctx.fill();ctx.globalAlpha=1;
    if(p.k==='heart'){glow(c,10);heartPath(p.x,p.y,7);ctx.fill();}
    else if(p.k==='shield'){ctx.strokeStyle=c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,8,0,7);ctx.stroke();ctx.fillStyle=c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();}
    else{glow(c,10);ctx.beginPath();ctx.moveTo(p.x+2,p.y-9);ctx.lineTo(p.x-5,p.y+1);ctx.lineTo(p.x,p.y+1);ctx.lineTo(p.x-2,p.y+9);ctx.lineTo(p.x+5,p.y-2);ctx.lineTo(p.x,p.y-2);ctx.closePath();ctx.fill();}
    ctx.shadowBlur=0;}}ctx.shadowBlur=0;}
function drawFT(m,u){for(const f of FT){ctx.globalAlpha=Math.min(1,f.l*1.6);txt(f.s,f.x,f.y,m?Math.max(18,u(20)):18,f.c,'center',0,1);}ctx.globalAlpha=1;}
// Embestidor: avisa con una línea de trayectoria, se detiene, carga en línea recta y descansa
function drawCharger(e,ph,pu){const x=e.x,y=e.y,r=e.r,a=Math.atan2(e.ay||0,e.ax||1);
  if(e.sd===1){const k=1-(e.tm||0)/.8;ctx.strokeStyle='rgba(255,138,60,'+(.25+.5*k)+')';ctx.lineWidth=2+3*k;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(e.ax||0)*320,y+(e.ay||0)*320);ctx.stroke();ctx.setLineDash([]);}
  ctx.globalCompositeOperation='lighter';let g=ctx.createRadialGradient(x,y,r*.4,x,y,r*2.4);g.addColorStop(0,'rgba(255,138,60,'+(.4+.3*pu)+')');g.addColorStop(1,'rgba(255,138,60,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.4,0,7);ctx.fill();ctx.globalCompositeOperation='source-over';
  ctx.save();ctx.translate(x,y);ctx.rotate(e.sd===2?a:a+Math.sin(t*14+ph)*.15);ctx.beginPath();ctx.moveTo(r*1.4,0);ctx.lineTo(-r*.9,r*.95);ctx.lineTo(-r*.4,0);ctx.lineTo(-r*.9,-r*.95);ctx.closePath();
  ctx.lineWidth=3.5;ctx.strokeStyle='#14000a';ctx.stroke();glow('#ff8a3c',8+14*pu);ctx.fillStyle=e.sd===1?'#ffd166':'#ff6a2a';ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,220,170,.9)';ctx.lineWidth=1.5;ctx.stroke();
  if(OPT.cb){ctx.strokeStyle='#ffe14d';ctx.lineWidth=2.5;ctx.stroke();}ctx.restore();}
// ===== PARTIDAS: continuar, niveles y mejoras permanentes =====
function startAt(L){if(L===0)return newGame();U.cd=Math.min(3,L>>1);U.dist=Math.min(3,Math.floor(L/3));U.hp=0;TK=[0,0,10,22,34,48,64,84][L];PW={};UNL.forEach(u=>{if(TK>=u.n)PW[u.k]=1;});nextHeal=(Math.floor(TK/30)+1)*30;gold=L*18;hpCarry=maxHp();pick=0;bankedRun=0;run(L);}
function continueGame(){const c=SAVE.cp;if(!c)return newGame();Object.assign(U,{dist:0,cd:0,hp:0},c.U);gold=c.gold;hpCarry=c.hpCarry;TK=c.TK;PW=Object.assign({},c.PW);nextHeal=c.nextHeal;pick=c.pick||0;bankedRun=c.banked||0;lv=c.lv-1;S='clear';stopMusic();shop();}
function menuBtns(){const b=[];if(SAVE.cp)b.push({t:'CONTINUAR',main:1,fn:continueGame},{t:'NUEVA PARTIDA',fn:newGame});else b.push({t:'JUGAR',main:1,fn:newGame});
  if(SAVE.unl>0)b.push({t:'NIVELES',fn:screenLevels});b.push({t:'MEJORAS',fn:screenUpgrades},{t:'OPCIONES',fn:screenOptions},{t:'CRÉDITOS',fn:screenCredits});return b;}
function screenLevels(){showOv('NIVELES',[' Elige un nivel desbloqueado. Empiezas con un equipo acorde a ese nivel.'],[{t:'VOLVER',main:1,fn:menu}]);const box=el('div');box.className='lvg';
  LV.forEach((L,i)=>{const b=el('button');b.innerHTML='<b>'+(i+1)+'</b><small>'+L.n+(L.g==='boss'?' · JEFE':'')+'</small>';b.disabled=i>SAVE.unl;b.onclick=()=>startAt(i);box.append(b);});
  ov.insertBefore(box,document.getElementById('bx'));}
const PERMS=[{k:'life',n:'Reservas',s:'+1 vida máxima e inicial',cost:[100]},{k:'mag',n:'Imán',s:'Atrae las monedas desde más lejos',cost:[60,120]},{k:'loot',n:'Botín',s:'+20 % de valor en las monedas',cost:[90,180]}];
let mobile=matchMedia('(pointer:coarse)').matches,joyOn=ls.get('filo.joy')!=='0',dq=null,ovGuard=0,hudL=14,hudR=346,jid=null,jc={x:0,y:0},jv=null,ctlOn=false;
const $=id=>document.getElementById(id),ctl=$('ctl'),jz=$('jz'),jb=$('jb'),jk=$('jk'),atk=$('atk'),jtg=$('jtg'),tst=$('toast'),fr=$('frame'),joyLabel=()=>'Controles: '+(joyOn?'JOYSTICK':'TOQUE DIRECTO');
const edge=e=>e.clientX<EDGE||e.clientY<EDGE||e.clientX>innerWidth-EDGE||e.clientY>innerHeight-EDGE;
function toast(s){tst.textContent=s;tst.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>tst.style.opacity=0,1700);}
function insets(){let p=$('probe');if(!p){p=document.createElement('div');p.id='probe';p.style.cssText='position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';document.body.append(p);}
  const c=getComputedStyle(p);return{l:parseFloat(c.paddingLeft)||0,r:parseFloat(c.paddingRight)||0,b:parseFloat(c.paddingBottom)||0};}
function applyMob(){document.body.classList.toggle('mob',mobile);setJoy(joyOn);resize();}
function setMob(){if(!mobile){mobile=true;applyMob();}}
function setJoy(v,say){joyOn=v;ls.set('filo.joy',v?'1':'0');jtg.textContent=v?'JOY':'TAP';if(say)toast(v?'Joystick + botón ATAQUE':'Toca la pantalla para disparar');jend();syncCtl(true);}
function syncCtl(f){const w=mobile&&joyOn&&S==='play'&&!paused;if(w===ctlOn&&!f)return;ctlOn=w;ctl.classList.toggle('on',w);if(w)layoutJoy();else jend();}
function layoutJoy(){JR=jb.offsetWidth/2||58;if(jid!==null)return;jb.className='';jk.style.transform='translate(0,0)';}
function jmove(e){const c=jb.getBoundingClientRect();let dx=e.clientX-(c.left+c.width/2),dy=e.clientY-(c.top+c.height/2);const l=Math.hypot(dx,dy)||1,m=Math.min(1,l/JR);
  if(l>JR){dx*=JR/l;dy*=JR/l;}
  jk.style.transform='translate('+dx+'px,'+dy+'px)';
  if(m>.15){const q=Math.hypot(dx,dy)||1;jv={x:dx/q,y:dy/q};jm=Math.min(1,.3+(m-.15)/.55*.7);}else{jv=null;jm=0;}}
function jend(){jid=null;jv=null;jm=0;layoutJoy();}
jz.addEventListener('pointerdown',e=>{if(jid!==null||edge(e))return;e.preventDefault();jid=e.pointerId;try{jz.setPointerCapture(jid)}catch(x){}jc={x:e.clientX,y:e.clientY};jb.className='on';jmove(e);});
jz.addEventListener('pointermove',e=>{if(e.pointerId===jid){e.preventDefault();jmove(e);}});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>jz.addEventListener(n,e=>{if(e.pointerId===jid)jend();}));
addEventListener('blur',()=>{jend();atkHeld=false;});document.addEventListener('visibilitychange',()=>{if(document.hidden)jend();});
document.addEventListener('gesturestart',e=>e.preventDefault());addEventListener('contextmenu',e=>{if(mobile)e.preventDefault();});
atk.addEventListener('pointerdown',e=>{e.preventDefault();atk.classList.add('dn');atkHeld=true;shoot();});
['pointerup','pointercancel','pointerleave'].forEach(n=>atk.addEventListener(n,()=>{atk.classList.remove('dn');atkHeld=false;}));
function tutorial(next){S='menu';
  const r=(c,t)=>'<span class="tr"><i class="'+c+'"></i><span>'+t+'</span></span>';
  showOv('CÓMO JUGAR',[joyOn?r('tj','Desliza el dedo en la <b>mitad izquierda</b> para moverte con el <b>joystick</b>.'):r('tj','<b>Toca</b> la pantalla para disparar hacia ese punto.'),
    joyOn?r('ta','En el nivel 1 solo esquivas. Desde el <b>nivel 2</b> aparece el botón <b>ATAQUE</b> (rojo) para disparar; mantenlo pulsado para ráfaga.'):r('ta','Desde el nivel 2 cada toque es un <b>disparo</b>. Destruye enemigos para desbloquear poderes.'),
    'Arriba ves tus <b>vidas</b>, tus <b>monedas ●</b> y el <b>objetivo</b> del nivel.','Puedes cambiar el tipo de control desde el menú principal o con el botón JOY / TAP.'],
    [{t:'¡ENTENDIDO!',main:1,fn:()=>{ls.set('filo.tut','1');next();}}]);}
const LV=[
{n:'Despertar',g:'time',v:25,life:7,spd:.86,fast:.2,smart:1,lead:.4,ramp:6,d:'Solo esquiva y sobrevive 25 segundos.',sh:0,sp:1.6}, // life: los enemigos se disipan a los 7 s; spd: velocidad de los perseguidores (x0,75). Equilibrado para un nivel sin disparo
{n:'Cacería',g:'kills',v:15,d:'Destruye 15 enemigos.',sh:.08,ch:.12,sp:1.3},
{n:'El Guardián',g:'boss',v:24,d:'Impacta al jefe 24 veces con tus disparos.',sh:0,sp:3},
{n:'Fuego cruzado',g:'time',v:60,kr:20,d:'Sobrevive 60 s y elimina 20 enemigos.',sh:.2,ch:.12,dv:.12,sp:1.2},
{n:'Cadena',g:'combo',v:5,d:'Encadena 5 eliminaciones (máx. 1,6 s entre cada una).',sh:.08,dv:.15,sd:.1,sp:1.1,grp:1},
{n:'La Torre',g:'boss',v:34,d:'Impacta al jefe 34 veces.',sh:.2,sp:2.8},
{n:'Marea roja',g:'kills',v:35,d:'Destruye 35 enemigos.',sh:.15,ch:.12,dv:.14,sd:.14,sp:.85},
{n:'El Corazón',g:'boss',v:46,d:'El jefe final. Impáctalo 46 veces.',sh:.15,sp:2.4}];

function el(tag,txt){const e=document.createElement(tag);if(txt)e.textContent=txt;return e;}
function showOv(title,lines,btns){
  ov.className='';void ov.offsetWidth;ov.className='fade';ov.innerHTML='';const h1=el('h1',title);if(title.length>6)h1.classList.add('md');ov.append(h1);
  lines.forEach(l=>{const p=el('p');p.innerHTML=l;ov.append(p);});
  const box=el('div');box.id='bx';
  btns.forEach(b=>{const x=el('button',b.t);x.disabled=!!b.off;if(b.main)x.className='main';x.onclick=e=>{if(mobile&&performance.now()<ovGuard)return;b.fn.call(x,e);};box.append(x);});
  ov.append(box);ov.style.display='flex';ovAt=performance.now();ovGuard=ovAt+450;
  primary=(btns.find(b=>b.main)||{}).fn||null;
